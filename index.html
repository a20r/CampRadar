<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#04060c">
<meta name="description" content="Find the closest public toilet in Toronto. 614 washrooms from City of Toronto open data and OpenStreetMap, on a neon vector map.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Loo Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
:root{
  --void:#04060c; --water:#071022; --panel:rgba(5,10,20,.90);
  --cyan:#33e6ff; --cyan-2:#a9f4ff; --cyan-dim:#1a7f95;
  --magenta:#ff2fd6; --amber:#ffa62b; --red:#ff3b5c; --mint:#5dffc0;
  --text:#d9f7ff; --dim:#6f9fb3; --line:rgba(51,230,255,.30);
  --display:'Michroma',system-ui,sans-serif;
  --mono:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;
  --body:'Rajdhani',system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
html,body{height:100%;margin:0;padding:0;background:var(--void);color:var(--text);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#app{position:fixed;inset:0;overflow:hidden;background:var(--void)}
#stage{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#stage.pin{cursor:crosshair}
#stage.pan{cursor:grabbing}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
.scan{position:absolute;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px);opacity:.8}
.vig{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 42%,transparent 40%,rgba(2,4,10,.78) 100%)}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(var(--sat) + 10px) 14px 10px;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,6,12,.94) 0%,rgba(4,6,12,.72) 70%,rgba(4,6,12,0) 100%)}
.hud-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand{position:relative;padding-left:12px}
.brand::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.title{font-family:var(--display);font-size:19px;letter-spacing:.22em;color:#fff;line-height:1;
  text-shadow:0 0 6px var(--cyan),0 0 18px rgba(51,230,255,.6);animation:flicker 9s infinite}
.title b{color:var(--magenta);font-weight:400;text-shadow:0 0 6px var(--magenta),0 0 18px rgba(255,47,214,.5)}
.sub{margin-top:6px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sub .jp{color:var(--magenta);letter-spacing:.35em;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;text-shadow:0 0 8px rgba(255,47,214,.7)}
.clock{text-align:right;font-family:var(--mono);font-size:12px;color:var(--cyan-2);letter-spacing:.12em;white-space:nowrap;font-variant-numeric:tabular-nums}
.clock small{display:block;font-size:9px;color:var(--dim);letter-spacing:.25em;margin-top:3px}
.readout{margin-top:10px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--cyan-2);text-transform:uppercase;min-height:14px}
.led{width:8px;height:8px;background:var(--mint);box-shadow:0 0 8px var(--mint);flex:none;animation:blink 1.6s steps(2,start) infinite}
.led.busy{background:var(--amber);box-shadow:0 0 8px var(--amber);animation-duration:.4s}
.led.lock{background:var(--magenta);box-shadow:0 0 8px var(--magenta);animation:none}
.coords{margin-top:4px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);font-variant-numeric:tabular-nums}
@keyframes blink{50%{opacity:.25}}
@keyframes flicker{0%,93%,100%{opacity:1}94%{opacity:.55}95%{opacity:1}97%{opacity:.7}98%{opacity:1}}

/* ---------- chips ---------- */
.chips{position:absolute;left:14px;right:14px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip{pointer-events:auto;font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:7px 10px;color:var(--dim);
  background:rgba(5,10,20,.82);border:1px solid rgba(111,159,179,.35);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);transition:color .2s,border-color .2s,background .2s}
.chip.on{color:#041017;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px rgba(51,230,255,.45)}
.chip.mag.on{background:var(--magenta);border-color:var(--magenta);box-shadow:0 0 12px rgba(255,47,214,.5);color:#fff}
.legend{position:absolute;left:14px;z-index:5;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim);display:flex;gap:10px;pointer-events:none}
.legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:1px}

/* ---------- neon side sign ---------- */
.sign{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:3;pointer-events:none;
  writing-mode:vertical-rl;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:22px;letter-spacing:.5em;color:#ffd0f5;
  text-shadow:0 0 6px var(--magenta),0 0 16px var(--magenta),0 0 34px rgba(255,47,214,.6);opacity:.85;animation:signflick 7s infinite}
.sign span{color:var(--cyan-2);text-shadow:0 0 6px var(--cyan),0 0 16px var(--cyan)}
@keyframes signflick{0%,71%,100%{opacity:.85}72%{opacity:.3}73%{opacity:.85}88%{opacity:.85}89%{opacity:.5}90%{opacity:.85}}

/* ---------- FAB ---------- */
.fab{position:absolute;left:50%;bottom:calc(var(--sab) + 22px);z-index:6;transform:translateX(-50%);
  width:min(320px,calc(100% - 48px));height:62px;display:flex;align-items:center;justify-content:center;gap:12px;
  font-family:var(--display);font-size:13px;letter-spacing:.2em;color:#041017;background:var(--cyan);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  box-shadow:0 0 18px rgba(51,230,255,.55),0 0 60px rgba(51,230,255,.25);transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
.fab svg{width:22px;height:22px;flex:none}
.fab::after{content:"";position:absolute;inset:-1px;border:2px solid var(--cyan);clip-path:inherit;opacity:0;animation:fabpulse 2.4s ease-out infinite}
@keyframes fabpulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.18,1.6);opacity:0}}
.fab-halo{position:absolute;left:50%;bottom:calc(var(--sab) + 22px);z-index:5;transform:translateX(-50%);width:min(320px,calc(100% - 48px));height:62px;pointer-events:none}
.fab-halo::before,.fab-halo::after{content:"";position:absolute;inset:-6px;border:1px solid rgba(51,230,255,.5);clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);animation:halo 2.4s ease-out infinite}
.fab-halo::after{animation-delay:1.2s}
@keyframes halo{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.25,1.9);opacity:0}}
.busy .fab,.busy .fab-halo,.card-open .fab,.card-open .fab-halo{transform:translate(-50%,180px);opacity:0;pointer-events:none}

/* ---------- result card ---------- */
.card{position:absolute;left:50%;bottom:0;z-index:7;width:min(560px,100%);transform:translate(-50%,110%);transition:transform .45s cubic-bezier(.2,.9,.25,1);
  background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:14px 16px calc(var(--sab) + 16px);clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,0 100%)}
.card::before{content:"";position:absolute;left:0;top:0;width:44%;height:2px;background:var(--magenta);box-shadow:0 0 10px var(--magenta)}
.card.show{transform:translate(-50%,0)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:4px 8px;border:1px solid currentColor;white-space:nowrap;text-transform:uppercase}
.pill.open{color:var(--mint)}.pill.closed{color:var(--red)}.pill.restricted{color:var(--amber)}.pill.unverified{color:var(--cyan-dim)}
.close{position:absolute;right:10px;top:34px;width:34px;height:34px;display:grid;place-items:center;color:var(--dim);font-family:var(--mono);font-size:16px}
.name{margin-top:6px;font-weight:700;font-size:22px;line-height:1.1;letter-spacing:.01em;color:#fff;text-wrap:balance;padding-right:40px}
.meta{margin-top:8px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.dist{font-family:var(--display);font-size:20px;color:var(--cyan);text-shadow:0 0 10px rgba(51,230,255,.6);font-variant-numeric:tabular-nums}
.walk{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.rows{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;font-weight:500;color:var(--text);line-height:1.3}
.rows b{font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;padding-top:3px}
.rows .warn{color:var(--amber)}
.actions{margin-top:14px;display:flex;gap:8px;align-items:stretch}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;font-family:var(--display);font-size:11px;letter-spacing:.18em;text-decoration:none;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn.primary{background:var(--magenta);color:#fff;box-shadow:0 0 16px rgba(255,47,214,.5);flex:2}
.btn.ghost{color:var(--cyan);border:1px solid var(--line);background:rgba(51,230,255,.06)}
.btn svg{width:16px;height:16px}
.srcline{margin-top:10px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.srcline a{color:var(--cyan-dim)}

/* ---------- overlay (acquire / errors) ---------- */
.overlay{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity .25s;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 20px calc(var(--sab) + 30px)}
.overlay.show{opacity:1}
.overlay.actions{pointer-events:auto;background:rgba(4,6,12,.55)}
.ov-box{width:min(420px,100%);font-family:var(--mono);color:var(--cyan-2);text-transform:uppercase;letter-spacing:.14em}
.ov-title{font-family:var(--display);font-size:15px;letter-spacing:.24em;color:#fff;text-shadow:0 0 10px var(--cyan);margin-bottom:6px}
.ov-jp{font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:11px;letter-spacing:.4em;color:var(--magenta);margin-bottom:12px}
.ov-lines{font-size:11px;line-height:1.7;white-space:pre;font-variant-numeric:tabular-nums;min-height:5.1em}
.ov-skip{margin-top:12px;font-size:9px;letter-spacing:.3em;color:var(--dim)}
.ov-actions{display:none;margin-top:14px;gap:8px;flex-direction:column}
.overlay.actions .ov-actions{display:flex}
.ov-actions .err{color:var(--amber);font-size:11px;line-height:1.5;margin-bottom:4px;text-transform:none;letter-spacing:.08em;font-family:var(--body);font-size:15px;font-weight:600}
.ov-actions button{height:46px;font-family:var(--display);font-size:11px;letter-spacing:.18em;color:var(--cyan);border:1px solid var(--line);background:rgba(5,10,20,.9);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.ov-actions button.primary{background:var(--cyan);color:#041017;border-color:var(--cyan)}

.flash{position:absolute;inset:0;z-index:4;pointer-events:none;background:#bff6ff;opacity:0;mix-blend-mode:screen}
.glitch{animation:glitch .16s steps(2,end) 1}
@keyframes glitch{0%{transform:translate(2px,0) skewX(1deg);filter:hue-rotate(40deg)}50%{transform:translate(-3px,1px);filter:hue-rotate(-60deg)}100%{transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.title,.sign,.fab::after,.fab-halo::before,.fab-halo::after,.led{animation:none}.glitch{animation:none}}
@media (max-height:640px){.sign{display:none}.name{font-size:19px}.rows{font-size:14px}}
</style>

</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="map"></canvas>
    <canvas id="fx"></canvas>
  </div>
  <div class="flash" id="flash"></div>
  <div class="scan"></div>
  <div class="vig"></div>

  <header class="hud" id="hud">
    <div class="hud-row">
      <div class="brand">
        <div class="title" id="title">LOO <b>RUNNER</b></div>
        <div class="sub"><span>TORONTO SANITATION GRID</span><span class="jp">トイレ検索</span></div>
      </div>
      <div class="clock"><span id="clock">--:--:--</span><small>TORONTO · LOCAL</small></div>
    </div>
    <div class="readout"><span class="led" id="led"></span><span id="status">GRID ONLINE</span></div>
    <div class="coords" id="coords">—</div>
  </header>

  <div class="chips" id="chips">
    <button class="chip on" id="chipOpen" aria-pressed="true">OPEN ONLY</button>
    <button class="chip" id="chipPublic" aria-pressed="false">PUBLIC ONLY</button>
    <button class="chip mag" id="chipPin" aria-pressed="false">SET PIN</button>
    <button class="chip" id="chipSfx" aria-pressed="false">SFX</button>
  </div>
  <div class="legend" id="legend">
    <span><i style="background:#5dffc0"></i>OPEN</span>
    <span><i style="background:#ffa62b"></i>RESTRICTED</span>
    <span><i style="background:#ff3b5c"></i>CLOSED</span>
    <span><i style="background:#1a7f95"></i>UNVERIFIED</span>
  </div>

  <div class="sign" aria-hidden="true">公衆<span>便所</span></div>

  <div class="fab-halo" aria-hidden="true"></div>
  <button class="fab" id="fab" aria-label="Find the closest public toilet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    <span>FIND CLOSEST</span>
  </button>

  <section class="card" id="card" aria-live="polite">
    <div class="card-top">
      <div class="eyebrow" id="eyebrow">NEAREST UNIT · 01</div>
      <span class="pill open" id="pill">OPEN</span>
    </div>
    <button class="close" id="btnClose" aria-label="Close">✕</button>
    <div class="name" id="cName">—</div>
    <div class="meta"><span class="dist" id="cDist">—</span><span class="walk" id="cWalk"></span></div>
    <div class="rows" id="cRows"></div>
    <div class="actions">
      <a class="btn primary" id="btnNav" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
        NAVIGATE
      </a>
      <button class="btn ghost" id="btnNext">NEXT ▸</button>
    </div>
    <div class="srcline"><span id="cSrc"></span><a id="cLink" href="#" target="_blank" rel="noopener" hidden>SOURCE RECORD ↗</a></div>
  </section>

  <div class="overlay" id="overlay">
    <div class="ov-box">
      <div class="ov-title" id="ovTitle">ACQUIRING POSITION</div>
      <div class="ov-jp" id="ovJp">位置特定中</div>
      <div class="ov-lines" id="ovLines"></div>
      <div class="ov-actions" id="ovActions">
        <div class="err" id="ovErr">No signal. Location is unavailable in this view.</div>
        <button class="primary" id="btnPinMode">TAP THE MAP TO SET POSITION</button>
        <button id="btnSim">SIMULATE A FIX</button>
        <button id="btnAbort">ABORT</button>
      </div>
      <div class="ov-skip" id="ovSkip">TAP ANYWHERE TO SKIP</div>
    </div>
  </div>

/* ---------------- FX layer ---------------- */
const drops = [];
function seedRain() { drops.length = 0; const n = reduceMotion ? 0 : Math.round(Math.min(160, W * H / 3800)); for (let i = 0; i < n; i++) drops.push({ x: Math.random() * W, y: Math.random() * H, l: 10 + Math.random() * 22, s: 520 + Math.random() * 560, a: .05 + Math.random() * .18 }); }
function drawRain(dt) {
  if (!drops.length) return;
  const c = fctx; c.lineWidth = 1;
  for (let k = 0; k < 3; k++) {
    c.strokeStyle = `rgba(170,225,255,${(k + 1) * .07})`; c.beginPath();
    for (let i = k; i < drops.length; i += 3) { const d = drops[i]; d.y += d.s * dt; d.x -= d.s * .16 * dt; if (d.y > H + 30) { d.y = -30; d.x = Math.random() * (W + 80); } if (d.x < -30) d.x = W + 20; c.moveTo(d.x, d.y); c.lineTo(d.x + d.l * .16, d.y - d.l); }
    c.stroke();
  }
}
function bracket(c, x, y, half, len, col, width) {
  c.strokeStyle = col; c.lineWidth = width || 1.5; c.beginPath();
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    c.moveTo(x + sx * half, y + sy * (half - len)); c.lineTo(x + sx * half, y + sy * half); c.lineTo(x + sx * (half - len), y + sy * half);
  }
  c.stroke();
}
function drawFX(t, dt) {
  const c = fctx; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
  c.lineCap = 'round'; c.lineJoin = 'round';
  const ph = seq.phase, el = t - seq.t0;

  // glitch slices (enhance ticks)
  if (t - seq.glitchT < 130 && !reduceMotion) {
    for (let i = 0; i < 5; i++) { const y = Math.random() * H, h = 4 + Math.random() * 22, dx = (Math.random() - .5) * 40; c.drawImage(map, 0, y * dpr, map.width, h * dpr, dx, y, W, h); }
    c.globalAlpha = .35; c.drawImage(map, 0, 0, map.width, map.height, 3, 0, W, H); c.globalAlpha = 1;
  }

  if (ph === 'acquire' || ph === 'lost') {
    c.fillStyle = 'rgba(4,6,12,0.5)'; c.fillRect(0, 0, W, H);
    const cx = W / 2, cy = H * .46, R = Math.hypot(W, H) * .55;
    // rings
    for (let i = 0; i < 4; i++) { const p = ((t / 1600) + i / 4) % 1; c.strokeStyle = `rgba(51,230,255,${(1 - p) * .35})`; c.lineWidth = 1; c.beginPath(); c.arc(cx, cy, p * R, 0, TAU); c.stroke(); }
    // sweep wedge
    const ang = (t / 1400) * TAU;
    let grad = null; try { grad = c.createConicGradient(ang - TAU * .28, cx, cy); } catch (e) { grad = null; }
    if (grad) { grad.addColorStop(0, 'rgba(51,230,255,0)'); grad.addColorStop(.28, 'rgba(51,230,255,0.28)'); grad.addColorStop(.281, 'rgba(51,230,255,0)'); grad.addColorStop(1, 'rgba(51,230,255,0)'); c.fillStyle = grad; c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fill(); }
    c.strokeStyle = 'rgba(169,244,255,0.9)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(ang) * R, cy + Math.sin(ang) * R); c.stroke();
    // crosshair
    c.strokeStyle = 'rgba(51,230,255,0.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(cx - 24, cy); c.lineTo(cx + 24, cy); c.moveTo(cx, cy - 24); c.lineTo(cx, cy + 24); c.stroke();
    // contacts: toilets the sweep passes over blink
    const S = scale(view.z);
    for (let i = 0; i < L.toilets.length; i += 2) { const tt = L.toilets[i]; const sx = (tt.x - view.cx) * S + W / 2, sy = (tt.y - view.cy) * S + H / 2; if (sx < 0 || sx > W || sy < 0 || sy > H) continue; const a = Math.atan2(sy - cy, sx - cx); let d = (ang - a) % TAU; if (d < 0) d += TAU; if (d < 1.2) { c.fillStyle = `rgba(93,255,192,${(1 - d / 1.2) * .9})`; c.fillRect(sx - 1.5, sy - 1.5, 3, 3); } }
    // uplink nodes
    seq.satPts.forEach((p, i) => { const pp = ((t / 1300) + i / 3) % 1; c.strokeStyle = `rgba(255,47,214,${(1 - pp) * .6})`; c.lineWidth = 1; c.beginPath(); c.arc(p[0], p[1], 6 + pp * 60, 0, TAU); c.stroke(); c.fillStyle = C.magenta; c.beginPath(); c.moveTo(p[0], p[1] - 6); c.lineTo(p[0] + 5, p[1] + 4); c.lineTo(p[0] - 5, p[1] + 4); c.closePath(); c.fill(); c.font = `9px ${FONT_MONO}`; c.fillStyle = 'rgba(255,208,245,0.8)'; c.textAlign = 'left'; c.fillText(`SAT-0${i + 1}`, p[0] + 10, p[1] + 3); });
    if (seq.fix) { // triangulation lines converge on the fix
      const q = proj(seq.fix.lon, seq.fix.lat), [ux, uy] = toScreen(q[0], q[1]);
      c.strokeStyle = 'rgba(255,47,214,0.7)'; c.setLineDash([4, 4]); c.lineDashOffset = -t / 20; c.lineWidth = 1; c.beginPath(); for (const p of seq.satPts) { c.moveTo(p[0], p[1]); c.lineTo(clamp(ux, -50, W + 50), clamp(uy, -50, H + 50)); } c.stroke(); c.setLineDash([]);
    }
  }

  drawRain(dt);

  // user beacon
  if (user && ph !== 'acquire' && ph !== 'lost') {
    const [ux, uy] = toScreen(user.x, user.y);
    if (user.acc > 0) { const ar = user.acc / mpp(); if (ar > 10) { c.fillStyle = 'rgba(51,230,255,0.07)'; c.strokeStyle = 'rgba(51,230,255,0.3)'; c.lineWidth = 1; c.beginPath(); c.arc(ux, uy, ar, 0, TAU); c.fill(); c.stroke(); } }
    for (let i = 0; i < 3; i++) { const p = ((t / 2200) + i / 3) % 1; c.strokeStyle = `rgba(51,230,255,${(1 - p) * .55})`; c.lineWidth = 1.5; c.beginPath(); c.arc(ux, uy, 6 + p * 44, 0, TAU); c.stroke(); }
    c.fillStyle = 'rgba(51,230,255,0.35)'; c.beginPath(); c.arc(ux, uy, 11, 0, TAU); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(ux, uy, 4.5, 0, TAU); c.fill();
    c.strokeStyle = C.cyan; c.lineWidth = 1; c.beginPath(); c.moveTo(ux - 18, uy); c.lineTo(ux - 8, uy); c.moveTo(ux + 8, uy); c.lineTo(ux + 18, uy); c.moveTo(ux, uy - 18); c.lineTo(ux, uy - 8); c.moveTo(ux, uy + 8); c.lineTo(ux, uy + 18); c.stroke();
    c.font = `9px ${FONT_MONO}`; c.fillStyle = 'rgba(169,244,255,0.85)'; c.textAlign = 'left'; c.fillText(user.manual ? 'PIN' : 'YOU', ux + 14, uy - 12);

    if (ph === 'fly') { // enhance brackets converge on the user
      const p = clamp(el / seq.fly.dur, 0, 1), half = lerp(Math.min(W, H) * .48, 26, easeInOut(p));
      bracket(c, ux, uy, half, Math.max(8, half * .22), 'rgba(169,244,255,0.9)', 1.5);
      c.font = `10px ${FONT_MONO}`; c.fillStyle = C.cyan2; c.textAlign = 'left'; c.fillText(`ENHANCE ×${Math.pow(2, Math.max(0, seq.tick) + 1)}`, ux + half + 6, uy - half + 10);
    }
    if (ph === 'lock') {
      const p = clamp(el / 900, 0, 1);
      bracket(c, ux, uy, 26, 8, C.cyan2, 1.5);
      c.strokeStyle = `rgba(169,244,255,${1 - p})`; c.lineWidth = 2; c.beginPath(); c.arc(ux, uy, 26 + p * 140, 0, TAU); c.stroke();
      c.strokeStyle = `rgba(255,47,214,${(1 - p) * .8})`; c.lineWidth = 1; c.beginPath(); c.arc(ux, uy, 26 + p * 70, 0, TAU); c.stroke();
    }
    if (ph === 'sweep' || (ph === 'target' && !seq.mini)) {
      const r = seq.sweepR / mpp();
      if (ph === 'sweep') {
        const g = c.createRadialGradient(ux, uy, Math.max(0, r - 70), ux, uy, r);
        g.addColorStop(0, 'rgba(51,230,255,0)'); g.addColorStop(1, 'rgba(51,230,255,0.16)');
        c.fillStyle = g; c.beginPath(); c.arc(ux, uy, r, 0, TAU); c.fill();
        c.strokeStyle = 'rgba(169,244,255,0.9)'; c.lineWidth = 2; c.beginPath(); c.arc(ux, uy, r, 0, TAU); c.stroke();
        c.strokeStyle = 'rgba(51,230,255,0.25)'; c.lineWidth = 12; c.stroke();
      }
      // blips on crossed units
      for (const tt of L.toilets) {
        if (!tt.cross) continue; const age = (t - tt.cross) / 900; if (age > 1 && !seq.cands.includes(tt)) continue;
        const [sx, sy] = toScreen(tt.x, tt.y); if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) continue;
        const a = Math.max(0, 1 - age);
        c.strokeStyle = `rgba(93,255,192,${a})`; c.lineWidth = 1.5; c.beginPath(); c.arc(sx, sy, 4 + age * 22, 0, TAU); c.stroke();
      }
      // candidate tracers + labels
      seq.cands.forEach((tt, i) => {
        if (!tt.cross) return; const [sx, sy] = toScreen(tt.x, tt.y), age = clamp((t - tt.cross) / 500, 0, 1);
        const col = i === 0 ? C.magenta : 'rgba(93,255,192,0.8)';
        c.strokeStyle = col; c.lineWidth = i === 0 ? 1.5 : 1; c.setLineDash([3, 5]); c.lineDashOffset = -t / 15; c.beginPath(); c.moveTo(ux, uy); c.lineTo(lerp(ux, sx, age), lerp(uy, sy, age)); c.stroke(); c.setLineDash([]);
        if (age >= 1) { c.font = `10px ${FONT_MONO}`; c.textAlign = 'left'; const lab = `${String(i + 1).padStart(2, '0')} · ${fmtDist(tt.dist)}`; const w = c.measureText(lab).width + 8; c.fillStyle = 'rgba(4,6,12,0.8)'; c.fillRect(sx + 8, sy - 18, w, 14); c.fillStyle = i === 0 ? '#ffd0f5' : C.mint; c.fillText(lab, sx + 12, sy - 7); }
      });
    }
  }

  // target reticle
  if (target && user && (ph === 'target' || ph === 'done')) {
    const [tx, ty] = toScreen(target.x, target.y), [ux, uy] = toScreen(user.x, user.y);
    const p = ph === 'target' ? clamp(el / seq.fly.dur, 0, 1) : 1;
    c.strokeStyle = 'rgba(255,47,214,0.85)'; c.lineWidth = 1.5; c.setLineDash([6, 6]); c.lineDashOffset = -t / 12; c.beginPath(); c.moveTo(ux, uy); c.lineTo(lerp(ux, tx, p), lerp(uy, ty, p)); c.stroke(); c.setLineDash([]);
    if (p > .6) {
      const q = (p - .6) / .4, size = lerp(90, 18, easeOut(q)), rot = t / 1800;
      c.strokeStyle = C.magenta; c.lineWidth = 1.5;
      for (const [s, dir] of [[size, 1], [size * .72, -1]]) { c.save(); c.translate(tx, ty); c.rotate(rot * dir + Math.PI / 4); c.strokeRect(-s / 2, -s / 2, s, s); c.restore(); }
      c.fillStyle = 'rgba(255,47,214,0.25)'; c.beginPath(); c.arc(tx, ty, 10, 0, TAU); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(tx, ty, 3, 0, TAU); c.fill();
      if (q >= 1) { c.font = `10px ${FONT_MONO}`; c.textAlign = 'center'; const lab = 'TARGET ' + fmtDist(target.dist); const w = c.measureText(lab).width + 10; c.fillStyle = 'rgba(4,6,12,0.85)'; c.fillRect(tx - w / 2, ty - 34, w, 15); c.fillStyle = '#ffd0f5'; c.fillText(lab, tx, ty - 23); }
    }
  }

  // full-screen flash
  const fa = 1 - (t - seq.flashT) / 200;
  if (fa > 0) { $('flash').style.opacity = (fa * (seq.flashStrength || .35)).toFixed(3); } else if ($('flash').style.opacity !== '0') $('flash').style.opacity = '0';
}

/* ---------------- card ---------------- */
function showCard() { fillCard(); $('card').classList.add('show'); $('app').classList.add('card-open'); }
function hideCard() { $('card').classList.remove('show'); $('app').classList.remove('card-open'); }
function fillCard(quiet) {
  if (!target) return;
  const t = target, has = user && !isNaN(t.dist);
  const far = has && t.dist > 25000;
  $('eyebrow').textContent = far ? 'OUTSIDE THE GRID · NEAREST INDEXED UNIT' : user ? `${t === ranked[rankIdx] ? 'NEAREST UNIT' : 'SELECTED UNIT'} · ${String(rankIdx + 1).padStart(2, '0')} / ${ranked.length}` : 'SELECTED UNIT';
  const pill = $('pill'), st = t.s === 0 ? 'closed' : t.a === 'public' ? 'open' : t.a === 'unverified' ? 'unverified' : 'restricted';
  pill.className = 'pill ' + st; pill.textContent = st === 'restricted' ? (t.a === 'customers' ? 'CUSTOMERS ONLY' : 'PERMISSIVE') : st === 'unverified' ? 'OPEN · UNVERIFIED' : st;
  $('cName').textContent = t.n.replace(/ \((customers only|permissive access)\)$/i, '');
  $('cDist').textContent = has ? fmtDist(t.dist) : '— M';
  $('cWalk').textContent = has ? fmtWalk(t.dist) : 'SET A POSITION FOR RANGE';
  const rows = [];
  if (t.s === 0) rows.push(['STATUS', `<span class="warn">CLOSED${t.r ? ' · ' + esc(t.r) : ''}</span>`]);
  else if (t.r) rows.push(['STATUS', `<span class="warn">${esc(t.r)}</span>`]);
  if (t.h) rows.push(['HOURS', esc(t.h)]);
  rows.push(['ACCESS', esc({ public: 'Public', customers: 'Customers only', permissive: 'Permissive', unverified: 'Unverified (OSM)' }[t.a] || t.a) + (t.f === 'yes' ? ' · fee' : t.f === 'no' ? ' · free' : '')]);
  if (t.ad) rows.push(['ADDRESS', esc(t.ad)]);
  if (t.d) rows.push(['WHERE', esc(t.d)]);
  if (t.w && t.w !== 'None') rows.push(['ACCESSIBLE', esc(t.w)]);
  if (t.t) rows.push(['TYPE', esc(t.t)]);
  $('cRows').innerHTML = rows.map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join('');
  $('btnNav').href = `https://www.google.com/maps/dir/?api=1&destination=${t.la},${t.lo}&travelmode=walking`;
  $('cSrc').textContent = (t.src === 'city' ? 'CITY OF TORONTO PARKS & REC' : 'OPENSTREETMAP') + ` · ${t.la.toFixed(5)}, ${t.lo.toFixed(5)}`;
  const link = $('cLink'); if (t.u) { link.href = t.u; link.hidden = false; } else link.hidden = true;
  $('btnNext').hidden = !(user && ranked.length > 1);
  if (user && has && !quiet) setStatus(far ? `OUTSIDE THE GRID · NEAREST ${fmtDist(t.dist)}` : `ROUTE READY · ${fmtDist(t.dist)} · ${fmtWalk(t.dist)}`, 'lock');
  updateCoordsIdle();
}
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

/* ---------------- gestures ---------------- */
let pinMode = false;
const pointers = new Map();
let pan = null, pinch = null, lastTap = 0, downInfo = null;
const rel = e => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  const q = rel(e); pointers.set(e.pointerId, q);
  downInfo = { x: q.x, y: q.y, t: now(), moved: false };
  if (pointers.size === 1) { pan = { sx: q.x, sy: q.y, cx: view.cx, cy: view.cy }; pinch = null; stage.classList.add('pan'); }
  else if (pointers.size === 2) { const [a, b] = [...pointers.values()]; const mid = [(a.x + b.x) / 2, (a.y + b.y) / 2]; pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y), z0: view.z, w0: toWorld(mid[0], mid[1]) }; pan = null; }
});
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const q = rel(e); pointers.set(e.pointerId, q);
  if (downInfo && Math.hypot(q.x - downInfo.x, q.y - downInfo.y) > 8) downInfo.moved = true;
  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()]; const mid = [(a.x + b.x) / 2, (a.y + b.y) / 2];
    view.z = clamp(pinch.z0 + Math.log2(Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0), ZMIN, ZMAX);
    const S = scale(view.z); view.cx = pinch.w0[0] - (mid[0] - W / 2) / S; view.cy = pinch.w0[1] - (mid[1] - H / 2) / S; dirty = true; onViewChange();
  } else if (pan && pointers.size === 1) {
    const S = scale(view.z); view.cx = pan.cx - (q.x - pan.sx) / S; view.cy = pan.cy - (q.y - pan.sy) / S; dirty = true; onViewChange();
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 1) { const [p] = [...pointers.values()]; pan = { sx: p.x, sy: p.y, cx: view.cx, cy: view.cy }; pinch = null; }
  else if (pointers.size === 0) {
    stage.classList.remove('pan'); pan = null; pinch = null;
    if (downInfo && !downInfo.moved && now() - downInfo.t < 400 && e.type === 'pointerup') { const dbl = now() - lastTap < 320; lastTap = dbl ? 0 : now(); const q = rel(e); onTap(q.x, q.y, dbl); }
    downInfo = null;
  }
}
stage.addEventListener('pointerup', endPointer); stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('wheel', e => { e.preventDefault(); const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top; const w = toWorld(mx, my); view.z = clamp(view.z - e.deltaY * 0.0022, ZMIN, ZMAX); const S = scale(view.z); view.cx = w[0] - (mx - W / 2) / S; view.cy = w[1] - (my - H / 2) / S; dirty = true; onViewChange(); }, { passive: false });
function onViewChange() { if (!busy()) updateCoordsIdle(); }
function onTap(sx, sy, dbl) {
  if (busy()) { if (seq.phase === 'lost') return; if (seq.phase === 'acquire' && !seq.fix) { abort(); return; } finishNow(); return; }
  if (pinMode) { const [lon, lat] = unproj(...toWorld(sx, sy)); pinMode = false; stage.classList.remove('pin'); $('chipPin').classList.remove('on'); $('chipPin').setAttribute('aria-pressed', 'false'); runWithPosition(lat, lon, 0, true); return; }
  if (dbl) { const w = toWorld(sx, sy); view.z = clamp(view.z + 1, ZMIN, ZMAX); const S = scale(view.z); view.cx = w[0] - (sx - W / 2) / S; view.cy = w[1] - (sy - H / 2) / S; dirty = true; onViewChange(); return; }
  // hit test toilets
  let best = null, bd = 22;
  for (const t of L.toilets) { const [x, y] = toScreen(t.x, t.y); const d = Math.hypot(x - sx, y - sy); if (d < bd) { bd = d; best = t; } }
  if (best) { target = best; if (user) { const i = ranked.indexOf(best); rankIdx = i >= 0 ? i : rankIdx; } showCard(); SFX.ui(); }
  else if ($('card').classList.contains('show')) hideCard();
}
function runWithPosition(lat, lon, acc, manual) {
  hideCard(); for (const t of L.toilets) t.cross = 0;
  setUser(lat, lon, acc, manual);
  $('app').classList.add('busy'); $('overlay').classList.add('show'); $('overlay').classList.remove('actions');
  seq.satPts = [[W * .12, H * .2], [W * .9, H * .28], [W * .5, H * .78]];
  beginFly();
}

/* ---------------- controls ---------------- */
$('fab').addEventListener('click', () => { SFX.ui(); startFind(); });
$('btnClose').addEventListener('click', () => { hideCard(); SFX.ui(); });
$('btnNext').addEventListener('click', () => { if (!ranked.length) return; retarget((rankIdx + 1) % Math.min(ranked.length, 12), true); });
$('btnAbort').addEventListener('click', abort);
$('btnPinMode').addEventListener('click', () => { abort(); pinMode = true; stage.classList.add('pin'); $('chipPin').classList.add('on'); $('chipPin').setAttribute('aria-pressed', 'true'); setStatus('TAP THE MAP TO SET POSITION', 'busy'); });
$('btnSim').addEventListener('click', () => { abort(); const lat = 43.628 + Math.random() * .1, lon = -79.50 + Math.random() * .2; runWithPosition(lat, lon, 25 + Math.random() * 40, true); });
function toggleChip(id, fn) { $(id).addEventListener('click', () => { if (busy() && seq.phase !== 'lost') return; const on = !$(id).classList.contains('on'); $(id).classList.toggle('on', on); $(id).setAttribute('aria-pressed', String(on)); fn(on); SFX.ui(); }); }
toggleChip('chipOpen', on => { openOnly = on; refilter(); });
toggleChip('chipPublic', on => { publicOnly = on; refilter(); });
toggleChip('chipPin', on => { pinMode = on; stage.classList.toggle('pin', on); if (on) { hideCard(); setStatus('TAP THE MAP TO SET POSITION', 'busy'); } else abort(); });
toggleChip('chipSfx', on => { sfxOn = on; if (on) { ac(); SFX.lock(); } });
function refilter() { dirty = true; if (user && !busy()) { computeRank(); retarget(0, $('card').classList.contains('show')); } }
$('overlay').addEventListener('click', e => { if (e.target === $('overlay') && busy() && seq.phase !== 'lost') finishNow(); });
window.addEventListener('resize', () => { resize(); seedRain(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { dirty = true; layoutChrome(); });

/* ---------------- boot ---------------- */
resize(); seedRain();
{ // fit the whole city, leaving room for the HUD and the button
  const b = L.boundary, pad = { l: 10, r: 10, t: hudPad() + 30, b: 120 };
  Object.assign(view, fitBounds(b.minx, b.miny, b.maxx, b.maxy, pad));
}
scramble($('status'), `GRID ONLINE · ${L.toilets.length} UNITS · ${N_OPEN} OPEN`, 900);
updateCoordsIdle();
let last = now();
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  updateSeq(t);
  if (dirty) { drawBase(); dirty = false; }
  drawFX(t, dt);
}
requestAnimationFrame(frame);
})();

</script>
